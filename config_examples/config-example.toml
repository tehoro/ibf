# Sample Configration Showing Different Options

# Language Models to use
llm = "gpt-5.6-luna"
# Recommended local family: Gemma 4; copy the exact loaded model ID from LM Studio.
# llm = "lms:exact-loaded-gemma-4-model-id"  # local or network LM Studio
# prompt_profile = "compact"  # small-model profile; deterministic spot forecasts only
# llm_fallback = "gemini-3.7-flash"           # optional one-step cross-provider fallback
# lm_studio_base_url = "http://192.168.1.50:1234/v1"

# Recommended: Gemini hosted web search, cached for up to three local days.
# Experimental Brave research remains available with context_provider = "brave".
context_provider = "llm-search"
context_llm = "gemini-3.7-flash"
# context_fallback_llm = "gemini-3.7-flash"  # experimental Brave -> hosted fallback
translation_llm = "gpt-5.6-luna"
# translation_llm_fallback = "gpt-4o-mini"
enable_reasoning = true   # use reasoning or thinking where supported

# Default NWP model unless over-ridden - standard ECMWF ensemble at 0.25 degree resolution
model = "ens:ecmwf_ifs025"


# Location specific settings
location_forecast_days = 4
location_wordiness = "normal"
location_reasoning = "high"
location_impact_based = true
location_thin_select = 10   # thin ensemble members down to a representative 10

# Area specific settings
area_forecast_days = 2
area_wordiness = "brief"
area_reasoning = "high"
area_impact_based = true
area_thin_select = 10

# These are the default global units settings anyway, but given here for the avoidance of doubt
temperature_unit = "celsius"  
windspeed_unit = "kph"
precipitation_unit = "mm"

# The base index.html file is written to this location
web_root = "./outputs/example"

# If 0 this is ignored, but if greater than zero then we don't refresh any forecasts
# which were produced within this last number of minutes
# Useful for testing

minimum_refresh_minutes = 60


# A list of locations with their specific settings

[[location]]
name = "Road Town, British Virgin Islands"
translation_language = "Virgin Islands Creole English"
temperature_unit = "celsius(fahrenheit)"
windspeed_unit = "kph(mph)"

[[location]]
name = "Otaki, New Zealand"
translation_language = "Maori"

[[location]]
name = "Otaki, New Zealand"
model = "det:ecmwf_ifs"

[[location]]
name = "Seattle, Washington"
temperature_unit = "fahrenheit"
precipitation_unit = "in"
windspeed_unit = "mph"

[[location]]
name = "Boulder, Colorado"
model = "det:open-meteo"
snow_levels = true
temperature_unit = "fahrenheit"
precipitation_unit = "in"
windspeed_unit = "mph"

[[location]]
name = "Edmonton, Alberta"

[[location]]
name = "Halifax, Nova Scotia"

[[location]]
name = "Exeter, England"
windspeed_unit = "mph"


